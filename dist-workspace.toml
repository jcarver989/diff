[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.31.0"
ci = "github"
# The generated workflow is intentionally customized to only run for binary packages.
allow-dirty = ["ci"]
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]
installers = ["shell"]
install-path = "CARGO_HOME"
install-updater = false
