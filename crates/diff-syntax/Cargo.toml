[package]
name = "clankerdiff-syntax"
description = "Portable Arborium syntax highlighting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
arborium = { workspace = true, features = [
    "lang-asm", "lang-bash", "lang-batch", "lang-c", "lang-c-sharp",
    "lang-clojure", "lang-cmake", "lang-commonlisp", "lang-cpp", "lang-css",
    "lang-dart", "lang-diff", "lang-dockerfile", "lang-elixir", "lang-erlang",
    "lang-fish", "lang-fsharp", "lang-go", "lang-graphql", "lang-haskell",
    "lang-hcl", "lang-html", "lang-ini", "lang-java", "lang-javascript",
    "lang-json", "lang-just", "lang-kotlin", "lang-lua", "lang-make",
    "lang-markdown", "lang-meson", "lang-ninja", "lang-nix", "lang-objc",
    "lang-ocaml", "lang-perl", "lang-php", "lang-powershell", "lang-proto",
    "lang-python", "lang-r", "lang-rego", "lang-ruby", "lang-rust",
    "lang-scala", "lang-scheme", "lang-scss", "lang-solidity", "lang-sql",
    "lang-starlark", "lang-svelte", "lang-swift", "lang-toml", "lang-tsx",
    "lang-typescript", "lang-vue", "lang-x86asm", "lang-xml", "lang-yaml",
    "lang-zig", "lang-zsh",
] }
arborium-highlight.workspace = true
arborium-theme.workspace = true
lru.workspace = true
thiserror.workspace = true
clankerdiff-fingerprint = { version = "0.1.1", path = "../diff-fingerprint" }
clankerdiff-theme = { version = "0.1.1", path = "../diff-theme" }

[target.'cfg(target_family = "wasm")'.dependencies]
arborium-sysroot.workspace = true
