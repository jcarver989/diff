[package]
name = "diff-ratatui"
description = "Embeddable Ratatui diff review widget"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["diff-review", "markdown-review"]
syntax = ["dep:diff-syntax", "dep:diff-theme"]
diff-preview = ["syntax", "dep:diff-core"]
diff-review = ["diff-preview", "dep:crossterm"]
markdown = ["syntax", "dep:diff-markdown"]
markdown-review = ["markdown", "diff-markdown/review", "dep:diff-core", "dep:crossterm"]

[lints]
workspace = true

[dependencies]
crossterm = { workspace = true, optional = true }
diff-core = { version = "0.1.0", path = "../diff-core", optional = true }
diff-markdown = { version = "0.1.0", path = "../diff-markdown", optional = true }
diff-syntax = { version = "0.1.0", path = "../diff-syntax", optional = true }
diff-theme = { version = "0.1.0", path = "../diff-theme", optional = true }
ratatui.workspace = true
unicode-width.workspace = true

[dev-dependencies]
criterion.workspace = true
diff-core = { path = "../diff-core", features = ["test-support"] }
diff-git = { path = "../diff-git" }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "rendering"
harness = false
