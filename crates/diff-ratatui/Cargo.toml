[package]
name = "clankerdiff-ratatui"
description = "Embeddable Ratatui diff review widget"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["diff-review", "markdown-review"]
syntax = ["dep:clankerdiff-syntax", "dep:clankerdiff-theme"]
diff-preview = ["syntax", "dep:clankerdiff-core"]
diff-review = ["diff-preview", "dep:crossterm"]
markdown = ["syntax", "dep:clankerdiff-markdown"]
markdown-review = ["markdown", "clankerdiff-markdown/review", "dep:clankerdiff-core", "dep:crossterm"]
test-support = ["diff-review"]

[lints]
workspace = true

[dependencies]
crossterm = { workspace = true, optional = true }
clankerdiff-core = { version = "0.1.0", path = "../diff-core", optional = true }
clankerdiff-markdown = { version = "0.1.0", path = "../diff-markdown", optional = true }
clankerdiff-syntax = { version = "0.1.0", path = "../diff-syntax", optional = true }
clankerdiff-theme = { version = "0.1.0", path = "../diff-theme", optional = true }
ratatui.workspace = true
unicode-width.workspace = true

[dev-dependencies]
criterion.workspace = true
clankerdiff-core = { path = "../diff-core", features = ["test-support"] }
clankerdiff-git = { path = "../diff-git" }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[test]]
name = "widget"
required-features = ["test-support"]

[[test]]
name = "markdown_widget"
required-features = ["markdown-review", "test-support"]

[[test]]
name = "performance_contract"
required-features = ["test-support"]

[[bench]]
name = "rendering"
harness = false
required-features = ["test-support"]
