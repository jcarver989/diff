[package]
name = "clankerdiff-ratatui"
description = "Embeddable Ratatui diff review widget"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
test-support = []
crossterm-backend = ["ratatui/crossterm", "dep:crossterm"]

[lints]
workspace = true

[dependencies]
bitflags.workspace = true
crossterm = { workspace = true, optional = true }
clankerdiff-core = { version = "0.1.0", path = "../diff-core" }
clankerdiff-markdown = { version = "0.1.0", path = "../diff-markdown", features = ["review"] }
clankerdiff-syntax = { version = "0.1.0", path = "../diff-syntax" }
clankerdiff-theme = { version = "0.1.0", path = "../diff-theme" }
ratatui.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
criterion.workspace = true
clankerdiff-core = { path = "../diff-core", features = ["test-support"] }
clankerdiff-git = { path = "../diff-git" }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[test]]
name = "markdown_review_component_test"
path = "tests/markdown_review/component_test.rs"

[[test]]
name = "markdown_review_render_test"
path = "tests/markdown_review/render_test.rs"
required-features = ["test-support"]

[[test]]
name = "performance_contract"
required-features = ["test-support"]

[[example]]
name = "review"
required-features = ["crossterm-backend"]

[[example]]
name = "embedded_review"
required-features = ["crossterm-backend"]

[[example]]
name = "markdown_review"
required-features = ["crossterm-backend"]

[[example]]
name = "streaming_markdown"

[[bench]]
name = "markdown"
harness = false
required-features = ["test-support"]

[[bench]]
name = "rendering"
harness = false
required-features = ["test-support"]
