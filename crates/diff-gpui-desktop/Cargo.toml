[package]
name = "clankerdiff-gpui-desktop"
publish = false
description = "Native desktop shell for the GPUI diff viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.dist]
dist = true

[lints]
workspace = true

[dependencies]
clankerdiff-core = { version = "0.1.0", path = "../diff-core" }
clankerdiff-markdown = { version = "0.1.0", path = "../diff-markdown", features = ["review"] }
clankerdiff-theme = { version = "0.1.0", path = "../diff-theme" }
clankerdiff-git = { version = "0.1.0", path = "../diff-git" }
clankerdiff-gpui = { version = "0.1.0", path = "../diff-gpui" }
clankerdiff-watch = { version = "0.1.0", path = "../diff-watch" }
gpui.workspace = true
gpui_platform.workspace = true
gpui_tokio.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
