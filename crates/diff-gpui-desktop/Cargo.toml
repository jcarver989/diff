[package]
name = "diff-gpui-desktop"
description = "Native desktop shell for the GPUI diff viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.dist]
dist = true

[lints]
workspace = true

[dependencies]
diff-core = { path = "../diff-core" }
diff-markdown = { path = "../diff-markdown", features = ["review"] }
diff-theme = { path = "../diff-theme" }
diff-git = { path = "../diff-git" }
diff-gpui = { path = "../diff-gpui" }
diff-watch = { path = "../diff-watch" }
gpui.workspace = true
gpui_platform.workspace = true
gpui_tokio.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
