[package]
name = "clankerdiff-gpui"
publish = false
description = "Reusable GPUI diff review component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
test-support = ["clankerdiff-core/test-support", "gpui/test-support"]

[lints]
workspace = true

[dependencies]
clankerdiff-core = { version = "0.1.1", path = "../diff-core" }
clankerdiff-markdown = { version = "0.1.1", path = "../diff-markdown", features = ["review"] }
clankerdiff-syntax = { version = "0.1.1", path = "../diff-syntax" }
clankerdiff-theme = { version = "0.1.1", path = "../diff-theme" }
gpui.workspace = true

[[test]]
name = "rendered"
required-features = ["test-support"]

[dev-dependencies]
clankerdiff-core = { path = "../diff-core", features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
gpui_platform.workspace = true
