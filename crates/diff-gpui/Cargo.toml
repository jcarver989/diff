[package]
name = "diff-gpui"
description = "Reusable GPUI diff review component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
test-support = ["diff-core/test-support", "gpui/test-support"]

[lints]
workspace = true

[dependencies]
diff-core = { path = "../diff-core" }
diff-markdown = { path = "../diff-markdown", features = ["review"] }
diff-syntax = { path = "../diff-syntax" }
diff-theme = { path = "../diff-theme" }
gpui.workspace = true

[[test]]
name = "rendered"
required-features = ["test-support"]

[dev-dependencies]
diff-core = { path = "../diff-core", features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
gpui_platform.workspace = true
