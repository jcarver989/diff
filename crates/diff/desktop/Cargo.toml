clankerdiff-client = { workspace = true, features = ["websocket"] }
clankerdiff-lspd = { workspace = true, features = ["daemon"] }
clankerdiff-server.workspace = true
clankerdiff-gpui.workspace = true
clankerdiff-gpui-shell.workspace = true
gpui.workspace = true
gpui-base.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
