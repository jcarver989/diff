[package]
name = "clankerdiff-desktop"
publish = false
description = "Native desktop shell for the Rouge diff viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.dist]
dist = true

[lints]
workspace = true

[dependencies]
clankerdiff-core.workspace = true
clankerdiff-markdown = { workspace = true, features = ["review"] }
clankerdiff-ui-core.workspace = true
clankerdiff-client = { workspace = true, features = ["websocket"] }
clankerdiff-lspd = { workspace = true, features = ["daemon"] }
clankerdiff-server.workspace = true
clankerdiff-rouge.workspace = true
rouge = { workspace = true, features = ["open-url", "tokio-rt"] }
rouge-widgets.workspace = true
log = { workspace = true, features = ["release_max_level_info"] }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing = { workspace = true, features = ["release_max_level_info"] }

[dev-dependencies]
tempfile.workspace = true
