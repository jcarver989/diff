[package]
name = "clankerdiff-client"
description = "Renderer-independent local and remote diff client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["websocket"]
websocket = ["dep:tokio-tungstenite", "dep:gloo-net", "dep:rand", "dep:js-sys"]

[dependencies]
clankerdiff-core.workspace = true
clankerdiff-protocol.workspace = true
async-channel.workspace = true
futures-util = { version = "0.3.31", features = ["sink"] }
http.workspace = true
tokio = { version = "1.47.1", default-features = false, features = ["sync"] }
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clankerdiff-protocol = { workspace = true, features = ["stream"] }
rand = { workspace = true, optional = true }
tokio.workspace = true
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3", optional = true }
wasm-bindgen-futures = "0.4.70"
gloo-timers = { version = "0.4", features = ["futures"] }
gloo-net = { version = "0.7", features = ["websocket"], default-features = false, optional = true }

[[example]]
name = "remote_review"
required-features = ["websocket"]

[dev-dependencies]
tokio.workspace = true
clankerdiff-core = { workspace = true, features = ["test-support"] }
