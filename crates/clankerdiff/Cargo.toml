[package]
name = "clankerdiff"
description = "Agent-driven code review CLI for Diff"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.dist]
dist = true

[lints]
workspace = true

[dependencies]
clankerdiff-protocol = { version = "0.1.0", path = "../clankerdiff-protocol" }
clap.workspace = true
crossterm.workspace = true
diff-core = { version = "0.1.0", path = "../diff-core" }
diff-git = { version = "0.1.0", path = "../diff-git" }
diff-markdown = { version = "0.1.0", path = "../diff-markdown", features = ["review"] }
diff-theme = { version = "0.1.0", path = "../diff-theme" }
diff-gpui-desktop = { version = "0.1.0", path = "../diff-gpui-desktop" }
diff-ratatui = { version = "0.1.0", path = "../diff-ratatui" }
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
shlex.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
