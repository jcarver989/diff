[package]
name = "clankerdiff-cli"
publish = false
description = "Agent-driven code review CLI for Diff"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "clankerdiff"
path = "src/main.rs"

[package.metadata.dist]
dist = true

[lints]
workspace = true

[dependencies]
clankerdiff-protocol = { version = "0.1.6", path = "../clankerdiff-protocol" }
clap.workspace = true
crossterm.workspace = true
clankerdiff-core = { version = "0.1.6", path = "../diff-core" }
clankerdiff-git = { version = "0.1.6", path = "../diff-git" }
clankerdiff-markdown = { version = "0.1.6", path = "../diff-markdown", features = ["review"] }
clankerdiff-theme = { version = "0.1.6", path = "../diff-theme" }
clankerdiff-gpui-desktop = { version = "0.1.0", path = "../diff-gpui-desktop" }
clankerdiff-ratatui = { version = "0.1.6", path = "../diff-ratatui", features = ["crossterm-backend"] }
clankerdiff-watch = { version = "0.1.6", path = "../diff-watch" }
ratatui = { workspace = true, features = ["crossterm"] }
serde.workspace = true
serde_json.workspace = true
shlex.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
clankerdiff-git = { version = "0.1.6", path = "../diff-git", features = ["test-support"] }
