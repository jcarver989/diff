[package]
name = "clankerdiff-cli"
publish = false
description = "Agent-driven code review CLI for Diff"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "clankerdiff"
path = "src/main.rs"

[package.metadata.dist]
dist = true

[lints]
workspace = true

[features]
default = ["desktop"]
desktop = ["dep:clankerdiff-gpui-desktop"]

[dependencies]
clankerdiff-client = { version = "0.3.2", path = "../diff-client" }
clankerdiff-server = { version = "0.3.2", path = "../diff-server" }
clankerdiff-protocol = { version = "0.3.2", path = "../diff-protocol" }
clap.workspace = true
crossterm.workspace = true
clankerdiff-core = { version = "0.3.2", path = "../diff-core" }
clankerdiff-git = { version = "0.3.2", path = "../diff-git" }
clankerdiff-markdown = { version = "0.3.2", path = "../diff-markdown", features = ["review"] }
clankerdiff-theme = { version = "0.3.2", path = "../diff-theme" }
clankerdiff-gpui-desktop = { path = "../diff-gpui-desktop", optional = true }
clankerdiff-ratatui = { version = "0.3.2", path = "../diff-ratatui", features = ["crossterm-backend"] }
ratatui = { workspace = true, features = ["crossterm"] }
serde.workspace = true
serde_json.workspace = true
shlex.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
clankerdiff-git = { version = "0.3.2", path = "../diff-git", features = ["test-support"] }
