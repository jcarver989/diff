[package]
name = "diff-theme"
description = "Renderer-neutral themes and palettes for Diff"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
tm-theme = ["dep:syntect"]

[lints]
workspace = true

[dependencies]
arborium-theme.workspace = true
diff-fingerprint = { version = "0.1.0", path = "../diff-fingerprint" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
syntect = { version = "5.2", optional = true, default-features = false, features = ["plist-load"] }
