[package]
name = "clankerdiff-gpui-web"
publish = false
description = "Browser WASM shell for the GPUI diff viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
clankerdiff-core = { version = "0.1.2", path = "../diff-core" }
clankerdiff-markdown = { version = "0.1.2", path = "../diff-markdown", features = ["review"] }
clankerdiff-theme = { version = "0.1.2", path = "../diff-theme" }
clankerdiff-gpui = { version = "0.1.0", path = "../diff-gpui" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
async-channel.workspace = true
console_error_panic_hook.workspace = true
gpui.workspace = true
gpui_web.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
    "console",
    "CustomEvent",
    "CustomEventInit",
    "Document",
    "EventTarget",
    "Storage",
    "Window",
] }
