[package]
name = "clankerdiff-protocol"
description = "Versioned subprocess and live session protocols for Clankerdiff"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
async-channel.workspace = true
clankerdiff-core = { version = "0.3.0", path = "../diff-core" }
clankerdiff-markdown = { version = "0.3.0", path = "../diff-markdown", features = ["review"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
clankerdiff-core = { version = "0.3.0", path = "../diff-core", features = ["test-support"] }
