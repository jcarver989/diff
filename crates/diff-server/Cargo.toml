[package]
name = "clankerdiff-server"
description = "Native repository backend and WebSocket service for clankerdiff"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["websocket"]
websocket = ["dep:axum", "dep:futures-util"]

[dependencies]
clankerdiff-core = { version = "0.3.2", path = "../diff-core" }
clankerdiff-protocol = { version = "0.3.2", path = "../diff-protocol" }
clankerdiff-git = { version = "0.3.2", path = "../diff-git" }
clankerdiff-watch = { version = "0.3.2", path = "../diff-watch" }
axum = { version = "0.8", features = ["ws"], optional = true }
futures-util = { version = "0.3.31", features = ["sink"], optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "net", "macros"] }
tokio-util = { version = "0.7.16", features = ["rt"] }

[dev-dependencies]
async-channel.workspace = true
tokio-tungstenite = "0.30"
tokio = { workspace = true, features = ["signal"] }
clankerdiff-client = { path = "../diff-client" }
clankerdiff-git = { path = "../diff-git", features = ["test-support"] }

[[example]]
name = "embedded_server"
required-features = ["websocket"]
