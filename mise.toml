[tasks.install]
description = "Build and install the release clankerdiff binary into Cargo's bin directory."
run = "cargo install --path crates/diff/cli --locked --force --profile release"

[tasks.profile-desktop]
description = "Profile desktop scrolling ([repo] [bench] [-- desktop-args...]); write ./rouge-trace.json"
run = '''
#!/usr/bin/env bash
set -euo pipefail
repo=${1-.}
bench=${2-scroll:60:600}
shift "$(( $# < 2 ? $# : 2 ))"
ROUGE_PROFILE=rouge-trace.json ROUGE_BENCH="$bench" cargo run --locked --profile release -p clankerdiff-desktop -- "$@" "$repo"
'''

[tasks.tui]
raw = true
run = "cargo run -p clankerdiff-ratatui --features crossterm-backend --example review"

[tasks.desktop]
run = "cargo run -p clankerdiff-desktop"

[tasks.ensure_trunk_installed]
run = '''
if ! command -v trunk >/dev/null 2>&1; then
    if command -v cargo-binstall >/dev/null 2>&1; then
        cargo binstall --no-confirm trunk
    else
        cargo install --locked trunk
    fi
fi
'''

[tasks.web]
depends = ["ensure_trunk_installed"]
dir = "crates/diff/web"
run = "trunk serve"

[tasks.doctest]
run = "cargo test --doc --workspace --all-features"

[tasks.bench-check]
description = "Compile benchmark targets without running statistical measurements."
run = "cargo bench --workspace --all-features --no-run"

[tasks.bench]
description = "Run the workspace's statistical rendering benchmarks."
run = "cargo bench --workspace --all-features"

[tasks.layer-check]
description = "Fail when a crate depends on a crate from a higher domain: util < ui < diff."
run = '''
#!/usr/bin/env bash
set -euo pipefail
violations="$(cargo metadata --format-version 1 --no-deps | jq -r '
    def domain: capture("/crates/(?<d>[^/]+)/[^/]+/Cargo.toml$").d;
    def rank: {"util": 0, "ui": 1, "diff": 2}[.] // error("unknown domain \(.)");
    (.packages | map({key: .name, value: (.manifest_path | domain)}) | from_entries) as $domains
    | .packages[]
    | (.manifest_path | domain) as $domain
    | .name as $name
    | .dependencies[]
    | select($domains[.name] != null and ($domains[.name] | rank) > ($domain | rank))
    | "\($name) (\($domain)) depends on \(.name) (\($domains[.name]))"')"
if [ -n "$violations" ]; then printf '%s\n' "$violations" >&2; exit 1; fi
'''

[tasks.feature-check]
depends = ["consumer-check", "layer-check"]
shell = "bash -euo pipefail -c"
run = '''
tree="$(cargo tree -p clankerdiff-desktop -e normal,build,dev --prefix none && cargo tree -p clankerdiff-web --target wasm32-unknown-unknown -e normal,build,dev --prefix none)"; if printf '%s\n' "$tree" | grep -Ei '^(gpui[^ ]*|clankerdiff-gpui[^ ]*) v'; then echo "legacy renderer present in graphical graph" >&2; exit 1; fi
tree="$(cargo tree -p clankerdiff-git -e normal --prefix none)"; if printf '%s\n' "$tree" | grep -E '^(rouge|rouge-(core|reactive|render|text|widgets|web|kit|shell|macros)|wgpu[^ ]*|winit|notify|ratatui[^ ]*|crossterm|clankerdiff-(watch|ratatui|markdown|rouge[^ ]*)) v'; then echo "unexpected renderer or watcher dependency in Git graph" >&2; exit 1; fi
tree="$(cargo tree -p clankerdiff-watch -e normal --prefix none)"; if printf '%s\n' "$tree" | grep -E '^(rouge|rouge-(core|reactive|render|text|widgets|web|kit|shell|macros)|wgpu[^ ]*|winit|ratatui[^ ]*|crossterm|clankerdiff-(ratatui|markdown|rouge[^ ]*)) v'; then echo "unexpected renderer dependency in watcher graph" >&2; exit 1; fi
tree="$(cargo tree -p clankerdiff-cli --no-default-features -e normal,build --prefix none)"; if printf '%s\n' "$tree" | grep -E '^(rouge|rouge-(core|reactive|render|text|widgets|web|kit|shell|macros)|wgpu[^ ]*|winit|clankerdiff-(rouge[^ ]*|desktop|web)) v'; then echo "unexpected renderer dependency in headless CLI graph" >&2; exit 1; fi
cargo check -p clankerdiff-ratatui --all-features --all-targets
tree="$(cargo tree -p clankerdiff-ratatui --no-default-features --features test-support -e normal --prefix none)"; if printf '%s\n' "$tree" | grep -E '^(rouge|rouge-(core|reactive|render|text|widgets|web|kit|shell|macros)|wgpu[^ ]*|winit|crossterm|ratatui-crossterm|syntect|two-face|clankerdiff-(git|watch|rouge[^ ]*)) v'; then echo "unexpected dependency in portable ratatui graph" >&2; exit 1; fi
tree="$(cargo tree -p clankerdiff-server --no-default-features -e normal --prefix none)"; if printf '%s\n' "$tree" | grep -E '^(axum|tower[^ ]*|matchit|tokio-tungstenite|tungstenite) v'; then echo "unexpected WebSocket dependency in embedded server graph" >&2; exit 1; fi
cargo clippy -p clankerdiff-server --no-default-features --all-targets -- -D warnings
'''

[tasks.consumer-check]
run = '''
nextest="$(mise which cargo-nextest)"
cargo test --manifest-path tests/rouge-consumer-fixture/Cargo.toml --target-dir target
"$nextest" nextest run --config-file .config/nextest.toml --manifest-path tests/consumer-fixture/Cargo.toml --target-dir target
"$nextest" nextest run --config-file .config/nextest.toml --manifest-path tests/consumer-fixture/Cargo.toml --target-dir target --features watch,crossterm-backend
"$nextest" nextest run --config-file .config/nextest.toml --manifest-path tests/consumer-fixture/Cargo.toml --target-dir target --features embedded
cargo test --doc --manifest-path tests/consumer-fixture/Cargo.toml --target-dir target
cargo test --doc --manifest-path tests/consumer-fixture/Cargo.toml --target-dir target --features watch,crossterm-backend
cargo test --doc --manifest-path tests/consumer-fixture/Cargo.toml --target-dir target --features embedded
'''

[tasks.remote-test]
description = "Exercise the remote backend, clients, and the headless CLI build."
run = '''
nextest="$(mise which cargo-nextest)"
"$nextest" nextest run -p clankerdiff-client -p clankerdiff-server --all-features
"$nextest" nextest run -p clankerdiff-server --no-default-features
cargo build -p clankerdiff-cli --no-default-features --bin clankerdiff
"$nextest" nextest run -p clankerdiff-cli --no-default-features
"$nextest" nextest run --config-file .config/nextest.toml --manifest-path tests/consumer-fixture/Cargo.toml --target-dir target --features remote
'''

[tasks.watch-test]
description = "Exercise the filesystem watcher against real Git worktrees."
run = '''
nextest="$(mise which cargo-nextest)"
"$nextest" nextest run -p clankerdiff-watch --all-features
cargo test --doc -p clankerdiff-watch --all-features
'''

[tasks.automation-check]
description = "Validate the GitHub Aether automation."
shell = "bash -euo pipefail -c"
run = '''
jq empty .aether/github.settings.json .aether/mcp.json
if [ -f .aether/settings.json ]; then jq empty .aether/settings.json; fi
for script in scripts/aether-agent/*; do bash -n "$script"; done
# actionlint does not yet recognize GitHub's concurrency.queue property.
actionlint -ignore 'unexpected key "queue" for "concurrency" section' \
    .github/workflows/aether-agent.yml .github/workflows/ci.yml
'''

[tasks.verify]
description = "Run every local verification check. CI intentionally runs these as separate jobs."
run = '''
mise run fmt-check
mise run check
mise run feature-check
mise run lint
mise run test
mise run doc-check
mise run automation-check
mise run package-check
'''

[tasks.package-check]
run = '''
cargo build --locked -p clankerdiff-desktop -p clankerdiff-cli
mise run dist-check
dist plan
'''

[tasks.published-consumer-check]
run = '''echo "Unavailable: the Rouge dependency graph uses unpublished sibling path packages." >&2; exit 1'''

[tasks.release-pr-preview]
run = "release-plz release-pr --dry-run"

[tasks.dist-plan-tag]
usage = 'arg "<tag>"'
run = '''dist plan --tag "${usage_tag?}"'''

[tasks.dist-build]
run = "dist build"

[tasks.check]
description = "Type-check every crate and target"
run = "cargo check --workspace --all-targets --all-features"

[tasks.test]
description = "Run tests with nextest, then doctests, which nextest doesn't run"
run = ['"$(mise which cargo-nextest)" nextest run --profile "${usage_profile?}" --workspace --all-features --no-tests pass', "cargo test --doc --workspace --all-features"]
usage = 'arg "[profile]" default="default"'

[tasks.test-ci]
description = "Run tests with nextest's CI profile, which writes JUnit results"
depends = ["test ci"]

[tasks.lint]
description = "Run Clippy, failing on any rustc, Clippy or Cargo warning"
run = ["CARGO_BUILD_WARNINGS=deny cargo clippy --workspace --all-targets --all-features", "CARGO_BUILD_WARNINGS=deny cargo clippy --manifest-path tests/consumer-fixture/Cargo.toml --target-dir target --all-targets --all-features"]

[tasks.fmt]
description = "Format all code"
run = ["cargo fmt --all", "cargo fmt --manifest-path tests/consumer-fixture/Cargo.toml"]

[tasks.fmt-check]
description = "Check formatting"
run = ["cargo fmt --all -- --check", "cargo fmt --manifest-path tests/consumer-fixture/Cargo.toml -- --check"]

[tasks.doc-check]
description = "Build docs, failing on any warning"
run = 'RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --document-private-items'

[tasks.framer]
description = "Regenerate files from .framer/"
run = "cargo run --quiet --manifest-path .framer/Cargo.toml"

[tasks.framer-check]
description = "Check generated files are up to date"
run = "cargo run --quiet --locked --manifest-path .framer/Cargo.toml -- --check"

[tasks.dist-plan]
description = "Preview what dist will build for the next release"
run = "dist plan"

[tasks.dist-generate]
description = "Regenerate the release workflow from dist-workspace.toml"
run = "python3 scripts/generate-dist-workflow.py"

[tasks.dist-check]
description = "Check the release workflow matches dist-workspace.toml"
run = "python3 scripts/generate-dist-workflow.py --check"

[tools]
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.152"
actionlint = "1.7.12"
cargo-dist = "0.31.0"
