name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

jobs:
  automation:
    name: Automation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - uses: jdx/mise-action@v4.2.5
      - name: Validate Aether automation
        run: just automation-check

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - uses: jdx/mise-action@v4.2.5
      - name: Check formatting
        run: just fmt-check

  lint:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - uses: jdx/mise-action@v4.2.5
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run Clippy
        run: just lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - uses: jdx/mise-action@v4.2.5
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run tests
        run: just test

  features:
    name: Minimal features
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - uses: jdx/mise-action@v4.2.5
      - uses: Swatinem/rust-cache@v2
      - name: Check portable adapter features
        run: just feature-check

  wasm:
    name: WASM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - uses: jdx/mise-action@v4.2.5
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check the browser target
        run: just wasm-check
      - name: Install browser test dependencies
        run: cd crates/diff-gpui-web && npm ci && npx playwright install --with-deps chromium
      - name: Run browser highlighting smoke test
        run: cd crates/diff-gpui-web && npm test

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - uses: jdx/mise-action@v4.2.5
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check documentation
        run: just doc-check
