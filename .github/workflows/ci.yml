# Generated by framer. Do not edit by hand: change .framer/src/main.rs and run `cargo framer`.
name: CI
on:
  pull_request:
  push:
    branches: [main]
env:
  CARGO_INCREMENTAL: "0"
permissions:
  contents: read
jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install tools
        uses: jdx/mise-action@v5.2.8
      - run: mise run fmt-check
  lint:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install tools
        uses: jdx/mise-action@v5.2.8
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libfontconfig1-dev libxkbcommon-dev libwayland-dev mesa-vulkan-drivers
      - run: mise run lint
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install tools
        uses: jdx/mise-action@v5.2.8
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libfontconfig1-dev libxkbcommon-dev libwayland-dev mesa-vulkan-drivers
      - run: mise run test-ci
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ runner.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install tools
        uses: jdx/mise-action@v5.2.8
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libfontconfig1-dev libxkbcommon-dev libwayland-dev mesa-vulkan-drivers
      - run: mise run doc-check
  framer:
    name: Generated files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install tools
        uses: jdx/mise-action@v5.2.8
      - run: mise run framer-check
  features:
    name: Minimal features
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install tools
        uses: jdx/mise-action@v5.2.8
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libfontconfig1-dev libxkbcommon-dev libwayland-dev mesa-vulkan-drivers
      - run: mise run feature-check
      - name: Test remote backend and headless CLI
        run: mise run remote-test
