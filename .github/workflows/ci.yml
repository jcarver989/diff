# Generated by framer. Do not edit by hand: change .framer/src/main.rs and run `cargo framer`.
name: CI
on:
  pull_request:
  push:
    branches: [main]
env:
  CARGO_INCREMENTAL: "0"
permissions:
  contents: read
jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install tools
        uses: jdx/mise-action@v5.2.3
      - run: just fmt-check
  lint:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install tools
        uses: jdx/mise-action@v5.2.3
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libfontconfig1-dev libxkbcommon-x11-dev
      - run: just lint
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install tools
        uses: jdx/mise-action@v5.2.3
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libfontconfig1-dev libxkbcommon-x11-dev
      - run: just test-ci
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ runner.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install tools
        uses: jdx/mise-action@v5.2.3
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libfontconfig1-dev libxkbcommon-x11-dev
      - run: just doc-check
  framer:
    name: Generated files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install tools
        uses: jdx/mise-action@v5.2.3
      - run: just framer-check
  features:
    name: Minimal features
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install tools
        uses: jdx/mise-action@v5.2.3
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libfontconfig1-dev libxkbcommon-x11-dev
      - run: just feature-check
      - name: Test remote backend and headless CLI
        run: just remote-test
  wasm:
    name: WASM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install tools
        uses: jdx/mise-action@v5.2.3
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libfontconfig1-dev libxkbcommon-x11-dev
      - uses: jetli/trunk-action@v0.5.1
        with:
          version: v0.21.14
      - run: just wasm-check
      - name: Install browser test dependencies
        run: cd crates/diff/web && npm ci && npx playwright install --with-deps chromium
      - name: Run browser highlighting smoke test
        run: cd crates/diff/web && npm test
