name: Aether agent

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: aether-agent-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
  queue: max

jobs:
  agent:
    name: Aether agent
    if: >-
      (github.event_name == 'issues'
       && github.event.label.name == 'assign-agent') ||
      (github.event_name == 'issue_comment'
       && github.event.issue.pull_request != null
       && startsWith(github.event.comment.body, '/aether')
       && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment'
       && startsWith(github.event.comment.body, '/aether')
       && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Generate release automation app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: diff

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Configure Git identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          bot_id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Install latest released Aether
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_HOME="$RUNNER_TEMP/aether-cargo"
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/contextbridge/aether/releases/latest/download/aether-agent-cli-installer.sh \
            | sh -s -- --no-modify-path
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Implement issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          cp .github/scripts/implement-issue.sh "$RUNNER_TEMP/implement-issue.sh"
          "$RUNNER_TEMP/implement-issue.sh"

      - name: Implement approved plan
        if: github.event_name == 'issue_comment' && github.event.comment.body == '/aether implement-plan'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          cp .github/scripts/implement-plan.sh "$RUNNER_TEMP/implement-plan.sh"
          "$RUNNER_TEMP/implement-plan.sh"

      - name: Address pull request feedback
        if: github.event_name != 'issues' && github.event.comment.body != '/aether implement-plan'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          cp .github/scripts/address-pr-feedback.sh "$RUNNER_TEMP/address-pr-feedback.sh"
          "$RUNNER_TEMP/address-pr-feedback.sh"
