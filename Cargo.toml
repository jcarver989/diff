[workspace]
members = ["crates/util/*", "crates/ui/*", "crates/diff/*"]
exclude = ["patches/gpui"]
resolver = "3"

[workspace.package]
version = "0.3.3"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/jcarver989/diff"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dist]
inherits = "release"
lto = "thin"

[workspace.dependencies]
clankerdiff-fingerprint = { version = "0.3.3", path = "crates/util/fingerprint" }
clankerdiff-remote = { path = "crates/util/remote" }
clankerdiff-theme = { version = "0.3.3", path = "crates/ui/theme" }
clankerdiff-syntax = { version = "0.3.3", path = "crates/ui/syntax" }
clankerdiff-gpui-ui = { path = "crates/ui/gpui" }
clankerdiff-gpui-shell = { path = "crates/ui/gpui-shell" }
clankerdiff-core = { version = "0.3.3", path = "crates/diff/core" }
clankerdiff-protocol = { version = "0.3.3", path = "crates/diff/protocol" }
clankerdiff-client = { version = "0.3.3", path = "crates/diff/client", default-features = false }
clankerdiff-git = { version = "0.3.3", path = "crates/diff/git" }
clankerdiff-watch = { version = "0.3.3", path = "crates/diff/watch" }
clankerdiff-server = { version = "0.3.3", path = "crates/diff/server" }
clankerdiff-markdown = { version = "0.3.3", path = "crates/diff/markdown" }
clankerdiff-gpui = { path = "crates/diff/gpui" }
clankerdiff-ratatui = { version = "0.3.3", path = "crates/diff/ratatui" }
clankerdiff-gpui-desktop = { path = "crates/diff/desktop" }

async-channel = "2.5.0"
arborium-theme = "=2.18.2"
bitflags = "2.13.1"
blake3 = "1.8.7"
clap = { version = "4.6.6", features = ["derive"] }
diffy = "0.5.1"
console_error_panic_hook = "0.1.7"
gpui = { package = "gpui-pre", version = "=0.3.7", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
gpui_web = { package = "gpui-pre-web", version = "=0.3.7", default-features = false }
gpui-base = "=0.7.0"
http = "1.3.1"
ignore = "0.4.25"
imbl = "7.0.1"
lru = "0.19.0"
notify = "8.2.0"
nucleo-matcher = "0.3.1"
open = "5.4.2"
pulldown-cmark = "0.13.0"
rand = "0.10.2"
crossterm = "0.29.0"
criterion = "0.8.2"
ratatui = { version = "0.30.0", default-features = false, features = ["std", "layout-cache"] }
schemars = { version = "1.2.2", features = ["indexmap2"] }
serde = { version = "1.0.229", features = ["alloc", "derive", "rc"] }
similar = "3.2.0"
thiserror = "2.0.20"
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tree-sitter = "0.27.0"
unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"
serde_json = { version = "1.0.151", features = ["alloc"] }
shlex = "2.0.1"
tempfile = "3.21.0"
wasm-bindgen = "0.2.120"
web-sys = "0.3.97"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[patch.crates-io]
gpui-pre = { path = "patches/gpui" }

