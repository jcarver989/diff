[package]
name = "clankerdiff-consumer-fixture"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
crossterm-backend = ["clankerdiff-ratatui/crossterm-backend"]

[dependencies]
clankerdiff-core = { version = "0.1.1" }
clankerdiff-theme = { version = "0.1.1" }
clankerdiff-syntax = { version = "0.1.1" }
clankerdiff-markdown = { version = "0.1.1", features = ["review"] }
clankerdiff-ratatui = { version = "0.1.1" }
clankerdiff-git = { version = "0.1.1" }
ratatui = { version = "0.30.0", default-features = false, features = ["std", "layout-cache"] }
tempfile = "3.21.0"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
