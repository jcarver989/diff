[package]
name = "clankerdiff-consumer-fixture"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
default = []
git = ["dep:clankerdiff-git", "dep:tempfile", "dep:tokio"]
watch = ["git", "dep:clankerdiff-watch"]
crossterm-backend = ["clankerdiff-ratatui/crossterm-backend"]

[dependencies]
clankerdiff-ratatui = { path = "../../crates/diff-ratatui", default-features = false }
clankerdiff-git = { path = "../../crates/diff-git", optional = true }
clankerdiff-watch = { path = "../../crates/diff-watch", optional = true }
ratatui = { version = "0.30.0", default-features = false, features = ["std", "layout-cache"] }
tempfile = { version = "3.21.0", optional = true }
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "sync", "time"], optional = true }
